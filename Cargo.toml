[package]
name = "rusty_map"
version = "0.1.0"
edition = "2024"

# For profiling
[profile.release]
debug = true
split-debuginfo = "off"

# Dependencies (MVT protobuf decoding, geometry) at full optimization even in dev builds — they
# rarely change so the compile cost is paid once, and unoptimized decoding was measured at
# ~700ms/tile.
[profile.dev.package."*"]
opt-level = 3

# Mild optimization for this crate too: tile style-filtering/color-batching (`filter+record`,
# measured 300-500ms/dense tile at opt-level 0) runs in our own code, which the package."*"
# override above does not cover. Level 1 keeps incremental builds fast.
[profile.dev]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = true

[workspace]
members = ["crates/map_component"]

[features]
hotreload = ["freya/hotreload"]

[dependencies]
freya = { path = "../freya/crates/freya", features = [
  "engine",
  "material-design",
  "icons",
] }
freya-icons = { path = "../freya/crates/freya-icons", features = ["lucide"] }
map_component = { path = "crates/map_component" }
freya-router = { path = "../freya/crates/freya-router" }
torin = { path = "../freya/crates/torin" }

mvt-reader = "2.4.0"
geo-types = "0.7"
rustc-hash = "2"
reqwest = { version = "0.12", features = [
  "rustls-tls",
  "gzip",
], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
bytes = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
freya-android = { path = "../freya/crates/freya-android" }
freya-winit = { path = "../freya/crates/freya-winit" }
android_logger = "0.15"
winit = { version = "0.30", features = ["android-native-activity", "rwh_06"] }
robius-location = { git = "https://github.com/project-robius/robius" }
