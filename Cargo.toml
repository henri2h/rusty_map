[package]
name = "rusty_map"
version = "0.1.0"
edition = "2024"

# cdylib: the Android app loads the crate as `librusty_map.so` (see `AndroidApp/`).
[lib]
name = "rusty_map"
crate-type = ["cdylib", "rlib"]

# For profiling
[profile.release]
debug = true
split-debuginfo = "off"

# Dependencies (MVT protobuf decoding, geometry) at full optimization even in dev builds — they
# rarely change so the compile cost is paid once, and unoptimized decoding was measured at
# ~700ms/tile.
[profile.dev.package."*"]
opt-level = 3

# Mild optimization for this crate too: tile style-filtering/color-batching (`filter+record`,
# measured 300-500ms/dense tile at opt-level 0) runs in our own code, which the package."*"
# override above does not cover. Level 1 keeps incremental builds fast.
[profile.dev]
opt-level = 1

# Debug APKs (`AndroidApp`, `./gradlew assembleDebug`): dependencies optimised like release, the
# app crate light and incremental, so a rebuild after an edit stays short.
[profile.android-dev]
inherits = "release"
debug = false
incremental = true
codegen-units = 256

[profile.android-dev.package.rusty_map]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = true

[workspace]
members = ["crates/map_component"]

[features]
hotreload = ["freya/hotreload"]
# On-screen frame timings (FPS, layout/render/present) — for profiling on a phone, where there's no
# profiler at hand. `cargo ndk ... build --features perf-overlay`, or see AndroidApp/Justfile.
perf-overlay = ["dep:freya-metrics-plugin"]

[dependencies]

freya = { git = "https://github.com/henri2h/freya", branch = "henri2h/changes-to-review", features = [
  "engine",
  "material-design",
  "icons",
] }

freya-icons = { git = "https://github.com/henri2h/freya", branch = "henri2h/changes-to-review", features = [
  "lucide",
] }
map_component = { path = "crates/map_component" }
freya-router = { git = "https://github.com/henri2h/freya", branch = "henri2h/changes-to-review" }
torin = { git = "https://github.com/henri2h/freya", branch = "henri2h/changes-to-review" }
freya-metrics-plugin = { git = "https://github.com/henri2h/freya", branch = "henri2h/changes-to-review", optional = true }

mvt-reader = "2.4.0"
geo-types = "0.7"
rustc-hash = "2"
reqwest = { version = "0.12", features = [
  "rustls-tls",
  "gzip",
], default-features = false }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "sync",
] }
bytes = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
freya-android = { git = "https://github.com/henri2h/freya", branch = "henri2h/changes-to-review" }
freya-winit = { git = "https://github.com/henri2h/freya", branch = "henri2h/changes-to-review" }
android_logger = "0.15"
# Calls into `MainActivity`: location updates, haptics (see `src/mobile.rs`).
jni = "0.21"
winit = { version = "0.30", features = ["android-native-activity", "rwh_06"] }
robius-location = { git = "https://github.com/project-robius/robius" }
