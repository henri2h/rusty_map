[package]
name = "map_component"
version = "0.1.0"
edition = "2024"

[dependencies]
freya = { path = "../../../freya/crates/freya", features = ["engine"] }
torin = { path = "../../../freya/crates/torin" }
freya-skia-safe = "0.104.0"

mvt-reader = "2.4.0"
geo-types = "0.7"
rustc-hash = "2"
reqwest = { version = "0.12", features = [
  "rustls-tls",
  "gzip",
], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
bytes = "1"
dirs = "6"
lru = "0.14"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
